name: Delete workflow runs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentWorkflowName = context.workflow;

            // Get all workflows
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
            });

            for (const workflow of workflows) {
              const isCurrentWorkflow = (workflow.name === currentWorkflowName);

              // Get all completed runs for this workflow
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflow.id,
                status: 'completed'
              });

              if (isCurrentWorkflow) {
                // Delete ALL runs of the current workflow
                for (const run of runs) {
                  console.log(`Deleting run ${run.id} of workflow "${workflow.name}"`);
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id
                  });
                }
              } else {
                // Group runs by branch
                const runsByBranch = {};
                for (const run of runs) {
                  if (!runsByBranch[run.head_branch]) {
                    runsByBranch[run.head_branch] = [];
                  }
                  runsByBranch[run.head_branch].push(run);
                }

                // Sort runs by created_at descending and delete older ones
                for (const branch in runsByBranch) {
                  const branchRuns = runsByBranch[branch];
                  // Sort descending: newest first
                  branchRuns.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                  // Retain first 3
                  const runsToDelete = branchRuns.slice(3);

                  for (const run of runsToDelete) {
                    console.log(`Deleting run ${run.id} of workflow "${workflow.name}" on branch "${branch}"`);
                    await github.rest.actions.deleteWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id
                    });
                  }
                }
              }
            }
